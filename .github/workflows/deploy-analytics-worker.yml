name: Deploy Analytics Proxy Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/analytics/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy analytics service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        working-directory: apps/analytics
        run: pnpm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN_ALT }}
          accountId: ${{ secrets.CF_ACC_ID_ALT }}
          workingDirectory: apps/analytics
